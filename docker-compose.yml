# Minimal turnkey deployment. `docker compose up -d`, then read the initial
# admin password with `docker compose logs guacamole | grep password`.
services:
  guacamole:
    image: ghcr.io/smck83/guacamole:latest
    container_name: guacamole
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - guacamole-data:/data
    environment:
      TZ: UTC

      # --- Optional: first-boot admin account (otherwise a random password
      # --- is generated and printed to the logs)
      # GUACADMIN_USERNAME: admin
      # GUACADMIN_PASSWORD: change-me

      # --- Feature toggles (upstream Guacamole variables) --------------------
      # TOTP_ENABLED: "true"            # two-factor auth for every user
      # TOTP_ISSUER: "Homelab"
      # BAN_ENABLED: "true"             # brute-force lockout (default on)
      # QUICKCONNECT_ENABLED: "true"    # ad-hoc connections by URI
      # RECORDING_ENABLED: "false"      # hide recording playback in history
      # DISPLAY_STATISTICS_ENABLED: "true"

      # --- Behind a reverse proxy (real client IPs in logs / ban extension) --
      # REMOTE_IP_VALVE_ENABLED: "true"

      # --- External database instead of the embedded one ---------------------
      # POSTGRESQL_HOSTNAME: db
      # POSTGRESQL_DATABASE: guacamole_db
      # POSTGRESQL_USERNAME: guacamole
      # POSTGRESQL_PASSWORD: secret

  # --- Optional: browser host for "URL connections" to internal web UIs -----
  # Enable with:  BROWSER_PASSWORD=<random> docker compose --profile browser up -d
  # Then in Guacamole add an RDP connection: hostname "browser", username
  # "browser", the same password, "Ignore server certificate" ticked, and
  # Initial program:  open-url https://192.168.89.1
  browser:
    image: ghcr.io/smck83/guacamole-browser:latest
    container_name: guacamole-browser
    restart: unless-stopped
    profiles: [browser]
    # No ports: only Guacamole needs to reach it, over the compose network
    security_opt:
      # Lets Chromium use its own (much stricter) per-tab sandbox, which needs
      # user namespaces that Docker's default seccomp profile blocks. Without
      # this line the browser falls back to --no-sandbox.
      - seccomp=unconfined
    shm_size: 512m
    environment:
      BROWSER_PASSWORD: ${BROWSER_PASSWORD:-}
      # BROWSER_MODE: kiosk                 # kiosk | app | full
      # BROWSER_IGNORE_CERT_ERRORS: "true"  # self-signed router/NAS certs
      # BROWSER_ALLOWED_URLS: "192.168.89.1,nas.home.arpa"

volumes:
  guacamole-data:
